{% extends "base.html" %}

{% block title %}Giriş Yap{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="auth-logo-icon">📦</span>
            <h1 class="auth-logo-text">StokYönet</h1>
            <p class="auth-tagline">İşletmenizin kontrolü elinizde</p>
        </div>

        <form id="giris-formu" method="POST" action="{{ url_for('giris') }}" novalidate>
            <div class="form-group">
                <label for="kullanici-adi" class="form-label">Kullanıcı Adı</label>
                <input
                    type="text"
                    id="kullanici-adi"
                    name="kullanici_adi"
                    class="form-input"
                    placeholder="Kullanıcı adınızı girin"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="sifre" class="form-label">Şifre</label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="sifre"
                        name="sifre"
                        class="form-input"
                        placeholder="Şifrenizi girin"
                        required
                        autocomplete="current-password"
                    >
                    <button type="button" class="toggle-sifre" id="toggle-sifre" aria-label="Şifreyi göster/gizle">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="giris-btn">
                Giriş Yap
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/giris.js') }}"></script>
{% endblock %}
